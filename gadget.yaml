device-tree-origin: kernel
volumes:
  emmc-uda:
    schema: gpt
    bootloader: u-boot
    structure:
      - name: ubuntu-boot-state
        offset: 10485760 # 0xA00000 bytes (20480)
        role: system-boot-state
        type: 3DE21764-95BD-54BD-A5C3-4ABE786F38A8
        size: 1M
      - name: partner
        offset: 11534336 # 0xA00000  + u-boot-env(0x100000) = 0xB00000
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 10M
      - name: tee-storage
        offset: 22020096 # 0xB00000 + partner(0xA00000) = 0x1500000
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 50M
      - name: ubuntu-seed
        offset: 74448896 # 0x1500000 + tee-storage(0x3200000) = 0x4700000
        role: system-seed
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 50M
      - name: ubuntu-system-a
        offset: 126877696 # 0x4700000 + ubuntu-seed(0x3200000) = 0x7900000
        type: 20117F86-E985-4357-B9EE-374BC1D8487D
        size: 500M
      - name: ubuntu-system-b
        offset: 651165696 # 0x7900000 + ubuntu-system-a(0x1F400000) = 0x26D00000
        type: 20117F86-E985-4357-B9EE-374BC1D8487D
        size: 500M
      - name: ubuntu-apps-a
        offset: 1175453696 # 0x26D00000 + ubuntu-system-b(0x1F400000) = 0x46100000
        type: 20117F86-E985-4357-B9EE-374BC1D8487D
        size: 500M
      - name: ubuntu-apps-b
        offset: 1699741696 # 0x46100000 + ubuntu-apps-a(0x1F400000) = 0x65500000
        type: 20117F86-E985-4357-B9EE-374BC1D8487D
        size: 500M
      - name: ubuntu-boot
        offset: 2224029696 # 0x65500000 + ubuntu-apps-a(0x1F400000) = 0x84900000
        role: system-boot
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 10M
      - name: ubuntu-save
        offset: 2234515456 # 0x84900000 + ubuntu-boot(0xA00000) = 0x85300000
        role: system-save
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 50M
      - name: ubuntu-data
        offset: 2286944256 # 0x85300000 + ubuntu-save(0x3200000) = 0x88500000
        role: system-data
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 10000M

  emmc-boot:
    schema: emmc
    structure:
      - name: boot0
        content:
          - image: blobs/imx-boot.bin

volume-assignments:
  - name: emmc0
    assignment:
      emmc-uda:
        device: /dev/disk/by-path/platform-42850000.mmc
      emmc-boot:
        device: /dev/disk/by-path/platform-42850000.mmc

defaults:
  # system retention settings
  system:
    refresh:
      retain: 2
    watchdog:
      runtime-timeout: 60s
      shutdown-timeout: 300s
