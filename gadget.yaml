device-tree-origin: kernel
volumes:
  emmc-uda:
    schema: gpt
    bootloader: u-boot
    structure:
      - offset: 33792  # 0x8400 bytes (66 sectors)
        size: 10451456 # 0x9F7C00 bytes (20414)
        type: bare
        content:
            - image: blobs/imx-boot.bin
      - name: u-boot-env
        offset: 10485760 # 0xA00000 bytes (20480)
        type: B3652CC6-0B39-4B22-9496-9AF8C018D12A
        size: 1M
      - name: partner
        offset: 11534336 # 0xA00000  + u-boot-env(0x100000) = 0xB00000
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 10M
      - name: tee-storage
        offset: 22020096 # 0xB00000 + partner(0xA00000) = 0x1500000
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 50M
      - name: ubuntu-seed
        offset: 74448896 # 0x1500000 + tee-storage(0x3200000) = 0x4700000
        role: system-seed
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 800M
      - name: ubuntu-boot
        offset: 913309696 # 0x4700000 + ubuntu-seed(0x32000000) = 0x36700000
        role: system-boot
        filesystem: vfat
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        # type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        size: 300M
        content:
          # TODO:UC20: install the boot.sel via snapd instead of via the gadget
          - source: boot.sel
            target: uboot/ubuntu/boot.sel
      - name: ubuntu-save
        offset: 1227882496 # 0x36700000 + ubuntu-boot(0x12C00000) = 0x49300000
        role: system-save
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 16M
      - name: ubuntu-data
        offset: 1244659712 # 0x49300000 + ubuntu-save(0x1000000) = 0x4A300000
        role: system-data
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 1000M

volume-assignments:
  - name: emmc0
    assignment:
      emmc-uda:
        device: /dev/disk/by-path/platform-42850000.mmc

defaults:
  # system retention settings
  system:
    refresh:
      retain: 2
    watchdog:
      runtime-timeout: 60s
      shutdown-timeout: 300s
