name: imx8mm-evk
summary: NXP i.MX8M Mini EVK support package
description: |
 Support files for booting i.MX8M Mini EVK board

version: 24-4-6.12.20-2.0.0
type: gadget

base: core24

platforms:
  arm64:
    build-on: [amd64, arm64]
    build-for: arm64

confinement: strict
grade: stable

environment:
  LD_LIBRARY_PATH: ${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}
  PATH: ${SNAP}/bin:${PATH}

apps:
  tee-supplicant:
    command: usr/sbin/tee-supplicant --fs-parent-path $SNAP_COMMON/tee-storage --ta-path $SNAP_COMMON/lib/optee_armtz --plugin-path $SNAP_COMMON/usr/lib/tee-supplicant/plugins
    daemon: simple
    install-mode: disable
    plugs:
      - network-bind
      - tee

  p11-kit-servers:
    command: usr/bin/p11-kit-servers start
    stop-command: usr/bin/p11-kit-servers stop
    daemon: forking
    after:
      - tee-supplicant
    install-mode: disable
    plugs:
      - tee
    slots:
      - pkcs11-optee-slot-0
      - pkcs11-optee-slot-1
      - pkcs11-optee-slot-2

  p11tool-optee:
    command: usr/bin/p11tool --provider $SNAP/usr/lib/aarch64-linux-gnu/libckteec.so
    plugs:
      - home
      - tee
      - pkcs11

  pkcs11-tool-optee:
    command: usr/bin/pkcs11-tool --module $SNAP/usr/lib/aarch64-linux-gnu/libckteec.so
    plugs:
      - home
      - tee
      - pkcs11

parts:
  arm-trusted-firmware:
    plugin: nil
    source: https://github.com/nxp-imx/imx-atf.git
    source-type: git
    source-tag: lf-6.12.20-2.0.0
    source-depth: 1
    build-environment:
      - PLAT: "imx8mm"
      - CROSS_COMPILE: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
    override-build: |
      make \
        PLAT=${PLAT} \
        BUILD_BASE="${CRAFT_PART_BUILD}/build" \
        bl31 \
        -j${CRAFT_PARALLEL_BUILD_COUNT}

      make \
        PLAT=${PLAT} \
        BUILD_BASE="${CRAFT_PART_BUILD}/build-optee" \
        SPD=opteed \
        bl31 \
        -j${CRAFT_PARALLEL_BUILD_COUNT}

      cp -f "${CRAFT_PART_BUILD}/build/${PLAT}/release/bl31.bin" \
            "${CRAFT_PART_INSTALL}/bl31-${PLAT}.bin"
      cp -f "${CRAFT_PART_BUILD}/build-optee/${PLAT}/release/bl31.bin" \
            "${CRAFT_PART_INSTALL}/bl31-${PLAT}.bin-optee"
    prime:
      - -*

  optee-keys:
    plugin: dump
    source: https://git.launchpad.net/~ondrak/+git/dev-keys
    source-type: git
    source-branch: ta-keys
    organize:
      '*': ta-keys/
    prime:
      - -*

  optee-os:
    after:
      - optee-fde
      - optee-keys
    plugin: nil
    source: https://github.com/nxp-imx/imx-optee-os.git
    source-type: git
    source-tag: lf-6.12.20-2.0.0
    source-depth: 1
    build-environment:
      - ARCH: "arm"
      - CFG_ARM64_core: "y"
      - CFG_USER_TA_TARGETS: "ta_arm64"
      - CFG_TEE_CORE_LOG_LEVEL: "1"
      - CFG_TEE_TA_LOG_LEVEL: "1"
      - CFG_TEE_BENCHMARK: "n"
      - CFG_TEE_CORE_DEBUG: "n"
      - CFG_TEE_RAM_VA_SIZE: "0x00280000"
      - CFG_CORE_HEAP_SIZE: "0x00100000"
      - CFG_LTO: "y"
      - CFG_TA_TEST: "n"
      - CFG_TA_BENCHMARK: "n"
      - CROSS_COMPILE: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
      - CROSS_COMPILE_core: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
      - CROSS_COMPILE_ta_arm64: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
      - DEBUG: "0"
      - PLATFORM: "imx"
      - PLATFORM_FLAVOR: "mx8mmevk"
      - PYTHON: "/usr/bin/python3"
      - PYTHONHOME: "/usr"
      - PYTHONPATH: "/usr/lib/python3.12:/usr/lib/python3.12/lib-dynload:/usr/lib/python3/dist-packages"
      - PYTHONIOENCODING: utf-8
      - TA_PUBLIC_KEY: "${CRAFT_STAGE}/ta-keys/ta_public.pem"
    override-build: |
      # add optee-fde TA
      cp -r "${CRAFT_STAGE}/optee-fde/ta/fde_key_handler" "${CRAFT_PART_BUILD}/ta"
      export OPTEE_VERSION=$(head -1 CHANGELOG.md  | sed 's/# OP-TEE - version \(.*\) (.*/\1/g')-imx
      make O="${CRAFT_PART_BUILD}/out" -j$(nproc)
      # build again with early TAs
      make O="${CRAFT_PART_BUILD}/out" \
           -j$(nproc) \
           CFG_EARLY_TA=y \
           EARLY_TA_PATHS="out/ta/pkcs11/fd02c9da-306c-48c7-a49c-bbd827ae86ee.stripped.elf \
                  out/ta/trusted_keys/f04a0fe7-1f5d-4b9b-abf7-619b85b4ce8c.stripped.elf \
                  out/ta/fde_key_handler/fd1b2a86-3668-11eb-adc1-0242ac120002.stripped.elf"

      "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-objcopy" \
         -O binary \
         "${CRAFT_PART_BUILD}/out/core/tee.elf" \
         "${CRAFT_PART_INSTALL}/tee.bin"
    prime:
      - -*

  optee-client:
    plugin: make
    source: https://github.com/OP-TEE/optee_client.git
    source-type: git
    source-tag: 4.2.0
    source-depth: 1
    make-parameters:
      - ARCH="arm64"
      - DEBUG=0
      - CROSS_COMPILE="${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
      - CFG_TEE_CLIENT_LOAD_PATH="/"
      - CFG_TA_TEST_PATH=n
      - CFG_TEE_SUPP_LOG_LEVEL=0
      - SBINDIR=/usr/sbin
      - LIBDIR="/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      - PKG_CONFIG=pkg-config
      - PKG_CONFIG_PATH="/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig"
    stage:
      - usr/sbin
      - usr/lib/*/lib*so*

  optee-fde:
    plugin: dump
    source: https://github.com/canonical/optee-uc-fde.git
    source-type: git
    source-branch: master
    organize:
      '*': optee-fde/
    prime:
      - -*

  pub-signing-key:
    plugin: dump
    source: https://git.launchpad.net/~ondrak/+git/dev-keys
    source-type: git
    source-branch: master
    stage:
      - u-boot-pubkey.dtsi
      - u-boot-dtb-pubkey.dtsi
    prime:
      - -*

  u-boot:
    after:
      - pub-signing-key
      - flash-script
    plugin: nil
    source: https://git.launchpad.net/~ondrak/+git/u-boot
    source-type: git
    source-tag: lf-6.12.20-2.0.0-uc
    source-depth: 1
    build-environment:
      - CC: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-gcc"
      - CROSS_COMPILE: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
    override-build: |
      # copy in place dtsi with pub part of kernel signing key
      cp -f "${CRAFT_STAGE}/u-boot-pubkey.dtsi" \
            "${CRAFT_PART_BUILD}/arch/arm/dts/u-boot-pubkey.dtsi"
      # TODO: REPLACE: if this is ODM gadget use true ODM key dtsi
      # If dtb signing key is not needed, set the same key as u-boot-pubkey
      cp -f "${CRAFT_STAGE}/u-boot-dtb-pubkey.dtsi" \
            "${CRAFT_PART_BUILD}/arch/arm/dts/u-boot-dtb-pubkey.dtsi"

      # update mmc_seed_part and mmc_boot_part from uc.lst
      mmc_seed_part="$(grep mmc_seed_part "${CRAFT_STAGE}/blobs/uc.lst" | sed -e 's/^# //')"
      mmc_boot_part="$(grep mmc_boot_part "${CRAFT_STAGE}/blobs/uc.lst" | sed -e 's/^# //')"
      sed -i \
          -e 's/mmc_seed_part=\(.*\)/'"${mmc_seed_part}"'/g' \
          -e 's/mmc_boot_part=\(.*\)/'"${mmc_boot_part}"'/g' \
          "${CRAFT_PART_BUILD}/board/freescale/imx8mm_evk/imx8mm_evk.env"

      # Add GIT revision to the local version
      head=$(git rev-parse --verify --short HEAD 2> /dev/null)
      imx_version=$(git describe --tags | cut -c 4-)
      printf "%s%s%s" "-${imx_version}" "+g" "${head}" > .scmversion

      make imx8mm_evk_config
      make -j${CRAFT_PARALLEL_BUILD_COUNT}

      cp -f "${CRAFT_PART_BUILD}/u-boot.bin" \
            "${CRAFT_PART_INSTALL}/u-boot.bin"
      cp -f "${CRAFT_PART_BUILD}/spl/u-boot-spl.bin" \
            "${CRAFT_PART_INSTALL}/u-boot-spl.bin"

      mkdir -p "${CRAFT_PART_INSTALL}/imx-boot-tools"
      cp -f "${CRAFT_PART_BUILD}/u-boot-nodtb.bin" \
            "${CRAFT_PART_INSTALL}/imx-boot-tools"
      cp -f "${CRAFT_PART_BUILD}/u-boot.dtb" \
            "${CRAFT_PART_INSTALL}/imx-boot-tools/imx8mm-evk.dtb"

      # copy tools/mkimage tool for imx-boot stage
      cp -f "${CRAFT_PART_BUILD}/tools/mkimage" \
            "${CRAFT_PART_INSTALL}"
      # Create files required for snapd to boot u-boot devices
      touch "${CRAFT_PART_INSTALL}/uboot.conf"
      "${CRAFT_PART_BUILD}/tools/mkenvimage" \
          -r -s 4096 \
          -o "${CRAFT_PART_INSTALL}/boot.sel" - < /dev/null
    prime:
      - boot.sel
      - uboot.conf

  imx-firmware:
    plugin: nil
    override-pull: |
      # latest firmware version can be found in
      # https://github.com/nxp-imx/meta-imx/ -b <relevant release> in SCR-<release version>.txt
      firmware_version="8.28-994fa14"
      wget https://www.nxp.com/lgfiles/NMG/MAD/YOCTO/firmware-imx-${firmware_version}.bin \
        -O firmware-imx.bin
    override-build: |
      chmod +x "${CRAFT_PART_BUILD}/firmware-imx.bin"
      "${CRAFT_PART_BUILD}/firmware-imx.bin" --force --auto-accept
      cp -r "${CRAFT_PART_BUILD}/firmware-imx-"*/firmware "${CRAFT_PART_INSTALL}/"
    prime:
      - -*

  imx-boot:
    after:
      - arm-trusted-firmware
      - imx-firmware
      - optee-os
      - u-boot
    plugin: nil
    source: https://github.com/nxp-imx/imx-mkimage.git
    source-type: git
    source-tag: lf-6.12.20-2.0.0
    source-depth: 1
    override-build: |
      platform="imx8mm"
      soc_family="iMX8M"
      # firmware files
      for ddr_firmware in lpddr4_pmu_train_1d_imem.bin \
                          lpddr4_pmu_train_1d_dmem.bin \
                          lpddr4_pmu_train_2d_imem.bin \
                          lpddr4_pmu_train_2d_dmem.bin
      do
        cp -f "${CRAFT_STAGE}/firmware/ddr/synopsys/${ddr_firmware}" \
              "${CRAFT_PART_BUILD}/${soc_family}"
      done

      cp -f "${CRAFT_STAGE}/firmware/hdmi/cadence/signed_dp_imx8m.bin" \
            "${CRAFT_PART_BUILD}/${soc_family}"
      cp -f "${CRAFT_STAGE}/firmware/hdmi/cadence/signed_hdmi_imx8m.bin" \
            "${CRAFT_PART_BUILD}/${soc_family}"

      # atf
      cp -f "${CRAFT_STAGE}/bl31-${platform}.bin-optee" \
            "${CRAFT_PART_BUILD}/${soc_family}/bl31.bin"

      # optee
      cp -f "${CRAFT_STAGE}/tee.bin" \
            "${CRAFT_PART_BUILD}/${soc_family}"

      # u-boot
      for bin in u-boot.bin u-boot-spl.bin \
                 imx-boot-tools/u-boot-nodtb.bin imx-boot-tools/${platform}-evk.dtb
      do
        cp -f "${CRAFT_STAGE}/${bin}" \
              "${CRAFT_PART_BUILD}/${soc_family}"
      done

      # setup link to mkimage_uboot
      ln -sf "${CRAFT_STAGE}/mkimage" "${soc_family}/mkimage_uboot"
      make SOC=iMX8MM flash_evk

      install -m 644 -D "${CRAFT_PART_BUILD}/${soc_family}/flash.bin" \
                        "${CRAFT_PART_INSTALL}/blobs/imx-boot.bin"

  flash-script: # uuu flash script
    plugin: nil
    override-build: |
      # get seed offset and size from gadget yaml
      convert_size() {
      case $1 in
        (0)  seed_size="0" ;;
        (*G | *g) echo $(expr $(echo $1 | sed -e 's/G//g' -e 's/g//g') \* 1024 \* 1024 \* 1024) ;;
        (*M | *m) echo $(expr $(echo $1 | sed -e 's/M//g' -e 's/m//g') \* 1024 \* 1024) ;;
        (*K | *k) echo $(expr $(echo $1 | sed -e 's/K//g' -e 's/k//g') \* 1024) ;;
        (*) echo ${1} ;;
      esac
      }

      # avoid confinement for yq as we might run as root
      yq="/snap/yq/current/bin/yq"
      # read all the partitions before ubuntu-boot and include those in the created part table
      # additionally calculate part number for seed and boot, we need those for u-boot build
      gpt_partitions="uuid_disk=\${uuid_gpt_disk}"
      part_number=0
      # this is good opportunity to validate offset of the partitions, if defined
      # it saves us from failed boot
      # default 1st partition offset is 1MB, unless defined otherwise
      partition_offset=0
      unset mmc_boot_part mmc_seed_part
      for p in $(${yq} eval '.volumes.["emmc-uda"].structure.[].name' ${CRAFT_PROJECT_DIR}/gadget.yaml)
      do
      # ignore bare structures
      if [ "${p}" != "null" ]; then
        part_number=$((part_number+1))
        # only read till ubuntu-boot partition
        if [ "${p}" == "ubuntu-boot" ]; then
          mmc_boot_part="${part_number}"
        fi
        if [ "${p}" == "ubuntu-seed" ]; then
          mmc_seed_part="${part_number}"
        fi

        # include partitions in the list
        export p=${p}
        p_offset=$(${yq} eval '.volumes.[].structure.[] | select(.name == env(p)) | .offset' "${CRAFT_PROJECT_DIR}/gadget.yaml")
        p_size=$(${yq} eval '.volumes.[].structure.[] | select(.name == env(p)) | .size' "${CRAFT_PROJECT_DIR}/gadget.yaml")
        p_type=$(${yq} eval '.volumes.[].structure.[] | select(.name == env(p)) | .type' "${CRAFT_PROJECT_DIR}/gadget.yaml")
        p_size=$(convert_size ${p_size})
        gpt_partitions="${gpt_partitions};name=${p},size=${p_size},start=${p_offset},type=${p_type}"
        if [ "${partition_offset}" == "0" ]; then
          # first partion, if there no offset defined, use default 1MB (1048576)
          if [ -n "${p_offset}" ] && [ "${p_offset}" != "null" ]; then
            partition_offset=${p_offset}
          else
            partition_offset=1048576
          fi
        fi
        if [ "${p_offset}" != "${partition_offset}" ]; then
          echo "Unexpected offset for partition ${p}, defined: ${p_offset}, expected: ${partition_offset}"
          exit 1
        else
          echo "Validated offset for partition ${p}, offset: ${p_offset}"
        fi
        # calculate next offset
        partition_offset=$((partition_offset+p_size))
        unset p
      fi
      done

      cat << EOF > "${CRAFT_PART_INSTALL}/uc.lst"
      uuu_version 1.4.69

      # This command will be run when i.MX6/7 i.MX8MM, i.MX8MQ
      SDP: boot -f imx-boot.bin

      # This command will be run when ROM support stream mode
      # i.MX8QXP, i.MX8QM
      SDPS: boot -f imx-boot.bin

      # These commands will be run when use SPL and will be skipped if no spl
      # SDPU will be deprecated. please use SDPV instead of SDPU
      # {
      SDPU: delay 1000
      SDPU: write -f imx-boot.bin -offset 0x57c00
      SDPU: jump
      # }

      # These commands will be run when use SPL and will be skipped if no spl
      # if (SPL support SDPV)
      # {
      SDPV: delay 1000
      SDPV: write -f imx-boot.bin -skipspl
      SDPV: jump
      # }

      # use fastboot to write bootloader
      FB: ucmd setenv fastboot_dev mmc
      FB: ucmd setenv mmcdev \${emmc_dev}
      FB: ucmd mmc dev \${emmc_dev}
      FB: flash bootloader  imx-boot.bin

      # create new partition table
      # boot critical partition number (used for u-boot build config)
      # mmc_boot_part=${mmc_boot_part}
      # mmc_seed_part=${mmc_seed_part}
      FB: ucmd setenv partitions '${gpt_partitions}'
      FB: ucmd gpt write mmc \${emmc_dev} \${partitions}

      # force re-read partition table
      FB: ucmd setenv mmcdev \${emmc_dev}
      FB: ucmd setenv fastboot_dev mmc
      FB: ucmd mmc dev \${emmc_dev}

      # Flashing partitions, use timeout 20s
      FB: ucmd echo "If ubuntu-seed, partner or ubuntu-seed  partitions do not exist, powercycle the device"
      FB: flash partner partner.img
      FB: flash tee-storage tee-storage.img
      FB[-t 20000]: flash ubuntu-seed ubuntu-seed.img
      FB: done
      EOF
    organize:
      uc.lst: blobs/
    build-snaps:
      - yq

  p11-kit-helpers:
    plugin: dump
    source: p11-kit-helpers
    organize :
      '*': usr/bin/

build-packages:
  - bison
  - build-essential
  - device-tree-compiler
  - flex
  - libgnutls28-dev
  - libssl-dev
  - libxml2-dev
  - pkgconf
  - python3
  - python3-cryptography
  - python3-pycryptodome
  - python3-pyelftools
  - wget
  - zlib1g-dev
  - efitools
  - on amd64:
    - gcc-${CRAFT_ARCH_TRIPLET_BUILD_FOR}
    - libc6-dev-${CRAFT_ARCH_BUILD_FOR}-cross
    - uuid-dev:${CRAFT_ARCH_BUILD_FOR}
    - uuid-dev
  - on arm64:
    - gcc
    - uuid-dev

package-repositories:
   - type: apt
     architectures: [$CRAFT_ARCH_BUILD_FOR]
     formats: [deb, deb-src]
     components: [main]
     suites: [noble, noble-updates, noble-backports]
     key-id: F6ECB3762474EDA9D21B7022871920D1991BC93C
     url: http://ports.ubuntu.com/ubuntu-ports

hooks:
  install:
    plugs:
      - tee-storage
  prepare-device:
    plugs:
      - hardware-observe

plugs:
  tee-storage:
    interface: mount-control
    mount:
    - what: /dev/disk/by-partlabel/tee-storage
      where: $SNAP_COMMON/tee-storage
      persistent: true
      type:
        - ext4
      options:
        - rw

slots:
  tee-plugins:
    interface: content
    write:
      - $SNAP_COMMON/usr/lib/tee-supplicant/plugins
  tee-tas:
    interface: content
    write:
      - $SNAP_COMMON/lib/optee_armtz
  pkcs11-optee-slot-0:
    interface: pkcs11
    pkcs11-socket: /run/p11-kit/optee-slot-0
  pkcs11-optee-slot-1:
    interface: pkcs11
    pkcs11-socket: /run/p11-kit/optee-slot-1
  pkcs11-optee-slot-2:
    interface: pkcs11
    pkcs11-socket: /run/p11-kit/optee-slot-2
  i2c-0:
    interface: i2c
    path: /dev/i2c-0
  i2c-1:
    interface: i2c
    path: /dev/i2c-1
