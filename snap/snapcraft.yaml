name: imx8mm-evk
summary: NXP i.MX8M Mini EVK support package
description: |
 Support files for booting i.MX8M Mini EVK board

version: 22-1
type: gadget

base: core22

architectures:
  - build-on: [amd64, arm64]
    build-for: arm64

confinement: strict
grade: stable

parts:
  arm-trusted-firmware:
    plugin: nil
    source: https://github.com/nxp-imx/imx-atf.git
    source-type: git
    source-tag: lf-5.15.71-2.2.0
    source-depth: 1
    build-environment:
      - PLAT: "imx8mm"
      - CROSS_COMPILE: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
    override-build: |
      make \
        PLAT=${PLAT} \
        BUILD_BASE="${CRAFT_PART_BUILD}/build" \
        bl31 \
        -j${CRAFT_PARALLEL_BUILD_COUNT}

      make \
        PLAT=${PLAT} \
        BUILD_BASE="${CRAFT_PART_BUILD}/build-optee" \
        SPD=opteed \
        bl31 \
        -j${CRAFT_PARALLEL_BUILD_COUNT}

      cp -f "${CRAFT_PART_BUILD}/build/${PLAT}/release/bl31.bin" \
            "${CRAFT_PART_INSTALL}/bl31-${PLAT}.bin"
      cp -f "${CRAFT_PART_BUILD}/build-optee/${PLAT}/release/bl31.bin" \
            "${CRAFT_PART_INSTALL}/bl31-${PLAT}.bin-optee"
    prime:
      - -*

  optee-keys:
    plugin: dump
    source: https://git.launchpad.net/~ondrak/+git/dev-keys
    source-type: git
    source-branch: ta-keys
    organize:
      '*': ta-keys/
    prime:
      - -*

  optee-os:
    after:
      - optee-fde
      - optee-keys
    plugin: nil
    source: https://github.com/nxp-imx/imx-optee-os.git
    source-type: git
    source-tag: lf-5.15.71-2.2.0
    source-depth: 1
    build-environment:
      - ARCH: "arm"
      - CFG_ARM64_core: "y"
      - CFG_USER_TA_TARGETS: "ta_arm64"
      - CFG_TEE_CORE_LOG_LEVEL: "1"
      - CFG_TEE_TA_LOG_LEVEL: "1"
      - CFG_TEE_BENCHMARK: "n"
      - CFG_TEE_CORE_DEBUG: "n"
      - CFG_TEE_RAM_VA_SIZE: "0x00280000"
      - CFG_CORE_HEAP_SIZE: "0x00100000"
      - CROSS_COMPILE: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
      - CROSS_COMPILE_core: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
      - CROSS_COMPILE_ta_arm64: "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-"
      - DEBUG: "0"
      - PLATFORM: "imx"
      - PLATFORM_FLAVOR: "mx8mmevk"
      - PYTHON: "/usr/bin/python3"
      - PYTHONHOME: "/usr"
      - PYTHONPATH: "/usr/lib/python3.11:/usr/lib/python3.11/lib-dynload:/usr/lib/python3/dist-packages"
      - PYTHONIOENCODING: utf-8
      - TA_PUBLIC_KEY: "${CRAFT_STAGE}/ta-keys/ta_public.pem"
    override-build: |
      # add optee-fde TA
      cp -r "${CRAFT_STAGE}/optee-fde/ta/fde_key_handler" "${CRAFT_PART_BUILD}/ta"
      export OPTEE_VERSION=$(head -1 CHANGELOG.md  | sed 's/# OP-TEE - version \(.*\) (.*/\1/g')-imx
      make O="${CRAFT_PART_BUILD}/out" -j$(nproc)
      # build again with early TAs
      make O="${CRAFT_PART_BUILD}/out" \
           -j$(nproc) \
           CFG_EARLY_TA=y \
           EARLY_TA_PATHS="out/ta/pkcs11/fd02c9da-306c-48c7-a49c-bbd827ae86ee.stripped.elf \
                  out/ta/trusted_keys/f04a0fe7-1f5d-4b9b-abf7-619b85b4ce8c.stripped.elf \
                  out/ta/fde_key_handler/fd1b2a86-3668-11eb-adc1-0242ac120002.stripped.elf"

      "${CRAFT_ARCH_TRIPLET_BUILD_FOR}-objcopy" \
         -O binary \
         "${CRAFT_PART_BUILD}/out/core/tee.elf" \
         "${CRAFT_PART_INSTALL}/tee.bin"
    prime:
      - -*

  optee-fde:
    plugin: dump
    source: https://git.launchpad.net/~ondrak/+git/optee-uc-fde
    source-type: git
    source-branch: master
    organize:
      '*': optee-fde/
    prime:
      - -*

  pub-signing-key:
    plugin: dump
    source: https://git.launchpad.net/~ondrak/+git/dev-keys
    source-type: git
    source-branch: master
    stage:
      - u-boot-pubkey.dtsi
    prime:
      - -*

build-packages:
  - bison
  - build-essential
  - device-tree-compiler
  - flex
  - libgnutls28-dev
  - libssl-dev
  - libxml2-dev
  - pkgconf
  - python3
  - python3-cryptography
  - python3-pycryptodome
  - python3-pyelftools
  - wget
  - zlib1g-dev
  - on amd64:
    - gcc-${CRAFT_ARCH_TRIPLET_BUILD_FOR}
    - libc6-dev-${CRAFT_ARCH_BUILD_FOR}-cross
    - uuid-dev:${CRAFT_ARCH_BUILD_FOR}
  - on arm64:
    - gcc
    - uuid-dev

package-repositories:
   - type: apt
     architectures: [$CRAFT_ARCH_BUILD_FOR]
     formats: [deb, deb-src]
     components: [main]
     suites: [noble, noble-updates, noble-backports]
     key-id: F6ECB3762474EDA9D21B7022871920D1991BC93C
     url: http://ports.ubuntu.com/ubuntu-ports
